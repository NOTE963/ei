<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 5 単語タイピング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* Layout: one centred "answer card" on lined notebook paper, stats strip above, buttons below. */
:root {
  --bg: #eeeaf6;
  --paper: #fbfaff;
  --ink: #26233f;
  --muted: #7b7796;
  --line: #d6d1e8;
  --accent: #3b3ac9;
  --accent-ink: #ffffff;
  --mark: #ffe45c;
  --good: #1f8a52;
  --bad: #c8372d;
  --font-jp: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17152b; --paper: #211f3b; --ink: #ecebfa; --muted: #9c98ba; --line: #36335a;
    --accent: #8f8dff; --accent-ink: #141230; --mark: #e6c93a; --good: #4cc98a; --bad: #ff7a6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17152b; --paper: #211f3b; --ink: #ecebfa; --muted: #9c98ba; --line: #36335a;
  --accent: #8f8dff; --accent-ink: #141230; --mark: #e6c93a; --good: #4cc98a; --bad: #ff7a6e;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-jp); font-size: 16px;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.15rem; font-weight: 900; letter-spacing: .02em; }
h1 span { background: linear-gradient(transparent 55%, var(--mark) 55%); padding: 0 .15em; }
.stats { display: flex; gap: 8px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; min-width: 76px; }
.stat small { display: block; font-size: .68rem; color: var(--muted); letter-spacing: .08em; }
.stat b { font-family: var(--font-mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.card {
  background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
  padding: 28px 22px 24px; display: flex; flex-direction: column; gap: 22px;
  background-image: repeating-linear-gradient(transparent 0 35px, var(--line) 35px 36px);
  background-position: 0 14px;
}
.label { font-size: .75rem; color: var(--muted); letter-spacing: .12em; background: var(--paper); align-self: flex-start; padding: 0 6px; margin-left: -6px; }
.prompt { font-size: clamp(1.5rem, 6.4vw, 2.1rem); font-weight: 900; line-height: 1.5; text-wrap: balance; background: var(--paper); padding: 6px 8px; margin: -6px -8px; border-radius: 8px; }
.field { position: relative; }
input[type="text"] {
  width: 100%; font-family: var(--font-mono); font-size: 1.5rem; font-weight: 700; color: var(--ink);
  background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; outline: none;
}
input[type="text"]:focus { border-color: var(--accent); }
input[type="text"]:disabled { opacity: 1; }
.card.ok input { border-color: var(--good); color: var(--good); }
.card.shake input { border-color: var(--bad); animation: shake .35s; }
.card.revealed input { border-color: var(--muted); }
@keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
.msg { min-height: 1.6em; font-weight: 700; background: var(--paper); padding: 0 6px; margin-inline: -6px; align-self: flex-start; }
.msg.ok { color: var(--good); } .msg.bad { color: var(--bad); }
.answer { font-family: var(--font-mono); font-weight: 700; font-size: 1.6rem; color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
button {
  font-family: var(--font-jp); font-size: 1rem; font-weight: 700; border-radius: 12px; padding: 13px 18px;
  cursor: pointer; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); flex: 1 1 140px;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
button:active { transform: translateY(1px); }
.note { color: var(--muted); font-size: .8rem; text-align: center; margin: 0; }

.home { display:flex; flex-direction:column; gap:12px; }
.home p { margin:0; color:var(--muted); font-size:.9rem; }
.mode { text-align:left; display:flex; flex-direction:column; gap:4px; padding:18px 18px 16px; border-radius:16px; flex:none; width:100%; }
.mode b { font-size:1.25rem; font-weight:900; }
.mode span { font-size:.85rem; font-weight:500; color:var(--muted); }
.mode em { font-style:normal; font-family:var(--font-mono); font-size:.8rem; color:var(--accent); }
.mode:hover { border-color:var(--accent); }
.back { flex:none; color:var(--muted); border-color:var(--line); padding:6px 12px; font-size:.8rem; border-width:1px; border-radius:8px; }
.result { background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:26px 22px; display:flex; flex-direction:column; gap:16px; }
.result h2 { margin:0; font-size:1rem; color:var(--muted); letter-spacing:.1em; }
.big { font-family:var(--font-mono); font-weight:700; font-size:3.4rem; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums; }
.big small { font-size:1.2rem; color:var(--muted); }
.result p { margin:0; line-height:1.6; }
.miss { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; padding:0; list-style:none; max-height:40vh; overflow:auto; }
.miss li { display:contents; }
.miss .w { font-family:var(--font-mono); font-weight:700; color:var(--bad); }
.miss .j { font-size:.85rem; color:var(--muted); min-width:0; }
.newbest { background:var(--mark); color:#26233f; align-self:flex-start; padding:2px 10px; border-radius:6px; font-weight:900; font-size:.85rem; }
.seg { display:flex; gap:0; align-self:flex-start; background:var(--paper); border:2px solid var(--ink); border-radius:10px; overflow:hidden; }
.seg button { flex:none; border:0; border-radius:0; padding:7px 18px; font-size:.9rem; background:var(--paper); }
.seg button.on { background:var(--ink); color:var(--paper); }
#padWrap { position:relative; }
#pad { display:block; width:100%; height:170px; background:var(--bg); border:2px solid var(--line); border-radius:12px; touch-action:none; cursor:crosshair; }
#padHint { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:.9rem; pointer-events:none; }
button.ok { background:var(--good); border-color:var(--good); color:#fff; }
button.ng { background:var(--bad); border-color:var(--bad); color:#fff; }
.submit { display:flex; flex-direction:column; gap:8px; border-top:1px dashed var(--line); padding-top:14px; }
.submit label { font-size:.8rem; color:var(--muted); letter-spacing:.06em; }
.submit .line { display:flex; gap:8px; }
.submit input { font-family:var(--font-jp); font-size:1rem; padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--ink); flex:1; min-width:0; }
.submit button { flex:none; padding:10px 16px; }
.hint { font-size:.85rem; color:var(--muted); min-height:1.3em; }
.rank-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.rank-list li { display:grid; grid-template-columns:2.2em 1fr auto; gap:10px; align-items:baseline; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
.rank-list .n { font-family:var(--font-mono); font-weight:700; color:var(--muted); }
.rank-list li:nth-child(-n+3) .n { color:var(--accent); }
.rank-list .nm { font-weight:700; overflow-wrap:anywhere; min-width:0; }
.rank-list .sc { font-family:var(--font-mono); font-weight:700; text-align:right; }
.rank-list small { display:block; font-family:var(--font-jp); font-weight:500; color:var(--muted); font-size:.72rem; }
@keyframes slidein { from { opacity:0; transform:translateX(28px); } to { opacity:1; transform:none; } }
.slide { animation: slidein .28s ease-out; }
@media (prefers-reduced-motion: reduce) { .slide { animation: none; } .card.shake input { animation: none; } }
</style>

</head>
<body>
<main>
  <section class="home" id="home">
    <header><h1><span>Unit 5</span> 単語タイピング</h1></header>
    <p>日本語の意味を見て、英単語を入力しよう。モードを選んでスタート。</p>
    <button class="mode" data-mode="free"><b>無限モード</b><span>30語をシャッフルして、ずっと出題。答えはボタンを押すまで出ません。</span><em id="hFree"></em></button>
    <button class="mode" data-mode="test"><b>テストモード</b><span>30語を1回ずつ、全部出題。最後に点数と間違えた単語を表示。</span><em id="hTest"></em></button>
    <button class="mode" data-mode="chal"><b>チャレンジモード</b><span>1回でも間違えたら終了。何問連続で正解できるか挑戦。</span><em id="hChal"></em></button>
    <button class="mode" id="toRank"><b>ランキング</b><span>みんなの記録を見る（チャレンジ／テスト）。</span></button>
  </section>

  <section class="home" id="order" hidden>
    <header><h1><span>テスト</span>モード</h1></header>
    <p>30問の出題順を選んでください。</p>
    <button class="mode" data-order="seq"><b>順番どおり</b><span>プリントの順番（1 → 30）で出題します。</span></button>
    <button class="mode" data-order="rand"><b>ランダム</b><span>30語をシャッフルして出題します。</span></button>
    <p class="note"><button type="button" class="back" id="orderBack">ホームにもどる</button></p>
  </section>

  <section class="home" id="rank" hidden>
    <header><button type="button" class="back" id="rankBack">← ホーム</button><h1><span>ランキング</span></h1></header>
    <div class="seg" id="rankSeg"><button type="button" data-k="chal" class="on">チャレンジ</button><button type="button" data-k="test">テスト</button></div>
    <div class="hint" id="rankMsg"></div>
    <ol class="rank-list" id="rankList"></ol>
  </section>

  <section id="play" hidden>
    <header>
      <button type="button" class="back" id="back">← ホーム</button>
      <div class="stats" id="stats" aria-live="polite"></div>
    </header>
    <form class="card" id="card" autocomplete="off" style="margin-top:16px">
      <div class="seg" id="seg" role="group" aria-label="解答の方法"><button type="button" data-im="type" class="on">入力</button><button type="button" data-im="write">書く</button></div>
      <span class="label" id="modeLabel">この意味の英単語は？</span>
      <div class="prompt" id="prompt">…</div>
      <div class="field">
        <input type="text" id="answer" aria-label="英単語を入力" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="英語を入力して Enter">
      </div>
      <div id="padWrap" hidden><canvas id="pad" aria-label="手書きの解答欄"></canvas><div id="padHint">ここに指やペンで書く</div></div>
      <div class="msg" id="msg"></div>
      <div class="row">
        <button type="button" id="clear" hidden>消す</button>
        <button type="button" id="reveal">答えを見る</button>
        <button type="button" class="ng" id="ng" hidden>× ちがった</button>
        <button type="button" class="ok" id="okb" hidden>○ 合ってた</button>
        <button type="submit" class="primary" id="go">答え合わせ</button>
      </div>
    </form>
    <p class="note" id="note" style="margin-top:16px"></p>
  </section>

  <section class="result" id="result" hidden></section>
</main>

<script>
const WORDS = [
  ["universal","すべての人々の"],["design","デザイン"],["fair","博覧会、フェア"],["bottle","びん、ボトル"],
  ["automatic","（機械などが）自動式の、機械的な、無意識の"],["adjustable","調節可能な"],["public","公の、公共の"],
  ["touch","～にさわる、ふれる"],["product","製品"],["facility","施設、設備"],["staff","職員、従業員"],
  ["both","～も…も両方"],["over here","こちらに、こちらでは"],["thanks to","～のおかげで"],["useful","役に立つ、有用な"],
  ["sign","標識、看板、掲示"],["young","若い、幼い"],["stairs","階段"],["wheelchair","車いす"],
  ["pull","～をひく、ひっぱる"],["baggage","（旅行者の）手荷物"],["professor","教授"],["childhood","子供のころ"],
  ["remove","～を取り除く"],["barrier","壁、障壁"],["regardless of","～にかかわらず"],["ability","能力、～できること、才能"],
  ["situation","立場、境遇、状況、情勢、場面"],["found","～を創立する"],["spread","～を広げる、広める"]
];
const $ = id => document.getElementById(id);
const card = $("card"), input = $("answer"), msg = $("msg");
const NOTES = {
  free: "正解するまで答えは出ません。わからないときだけ「答えを見る」を押します。",
  test: "30語を1回ずつ出題します。1回目で正解できた数が点数です。",
  chal: "1回でも間違えるか「答えを見る」を押すと終了です。"
};
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("unit5_" + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("unit5_" + k, JSON.stringify(v)); } catch (e) {} }
};
let rec = { free: store.get("free") || 0, chal: store.get("chal") || 0, test: store.get("test") || null };

let inputMode = store.get("im") === "write" ? "write" : "type", inked = false;
let testOrder = "rand", mode = null, bag = [], queue = [], idx = 0, cur = null, state = "ask", timer = null, last = -1;
let score = 0, streak = 0, best = 0, tried = false, missed = [], t0 = 0;

const norm = s => s.toLowerCase().replace(/\s+/g, " ").trim();
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function draw() {
  if (!bag.length) {
    bag = shuffle(WORDS.map((_, i) => i));
    if (bag[bag.length - 1] === last) bag.unshift(bag.pop());
  }
  last = bag.pop();
  return WORDS[last];
}
function show(id) {
  for (const x of ["home", "order", "rank", "play", "result"]) $(x).hidden = x !== id;
  const el = $(id); el.classList.remove("slide"); void el.offsetWidth; el.classList.add("slide");
  window.scrollTo(0, 0);
}
function home() {
  clearTimeout(timer); mode = null;
  $("hFree").textContent = rec.free ? "最高連続 " + rec.free + " 問" : "";
  $("hTest").textContent = rec.test ? "ベスト " + rec.test.score + " / 30（" + fmt(rec.test.ms) + "）" : "";
  $("hChal").textContent = rec.chal ? "最高 " + rec.chal + " 問連続" : "";
  show("home");
}
const fmt = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + "分" + String(s % 60).padStart(2, "0") + "秒"; };
function stat(label, val) { return '<div class="stat"><small>' + label + '</small><b>' + val + '</b></div>'; }
function renderStats() {
  $("stats").innerHTML = mode === "free" ? stat("正解", score) + stat("連続", streak) + stat("最高", Math.max(best, rec.free))
    : mode === "test" ? stat("問題", Math.min(idx, 30) + "/30") + stat("正解", score)
    : stat("連続", streak) + stat("最高", Math.max(streak, rec.chal));
}
function start(m, order) {
  if (m === "test") { testOrder = order || testOrder; }
  mode = m; score = 0; streak = 0; best = 0; missed = []; idx = 0; bag = []; t0 = Date.now();
  queue = m === "test" ? (testOrder === "seq" ? WORDS.slice() : shuffle(WORDS.slice())) : [];
  $("note").textContent = NOTES[m];
  show("play"); next();
}
function next() {
  clearTimeout(timer);
  if (mode === "test") {
    if (idx >= WORDS.length) return finish();
    cur = queue[idx++];
  } else cur = draw();
  state = "ask"; tried = false;
  card.className = "card";
  $("prompt").textContent = cur[1];
  input.value = ""; input.disabled = false;
  msg.className = "msg"; msg.textContent = "";
  $("reveal").textContent = mode === "chal" ? "ギブアップ" : "答えを見る"; $("go").hidden = false;
  renderStats(); ui();
}
const pad = $("pad"), ctx = pad.getContext("2d");
function sizePad() {
  const r = pad.getBoundingClientRect(); if (!r.width) return;
  const d = window.devicePixelRatio || 1; pad.width = r.width * d; pad.height = r.height * d;
  ctx.setTransform(d, 0, 0, d, 0, 0); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 4;
}
function clearPad() { ctx.clearRect(0, 0, pad.width, pad.height); inked = false; $("padHint").hidden = false; }
function ui() {
  const w = inputMode === "write", self = state === "self";
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.im === inputMode));
  input.hidden = w; $("padWrap").hidden = !w;
  $("clear").hidden = !(w && state === "ask");
  $("go").hidden = w || state === "revealed";
  $("reveal").hidden = self;
  $("reveal").classList.toggle("primary", w);
  if (state === "ask") $("reveal").textContent = (w || mode !== "chal") ? "答えを見る" : "ギブアップ";
  $("ng").hidden = $("okb").hidden = !self;
  if (w) { if (state === "ask") { sizePad(); clearPad(); } }
  else if (state === "ask") input.focus();
}
let drawing = false;
pad.addEventListener("pointerdown", e => {
  if (state !== "ask") return;
  drawing = true; pad.setPointerCapture(e.pointerId);
  const r = pad.getBoundingClientRect(); ctx.strokeStyle = getComputedStyle(document.body).color;
  ctx.beginPath(); ctx.moveTo(e.clientX - r.left, e.clientY - r.top);
  ctx.lineTo(e.clientX - r.left + .1, e.clientY - r.top + .1); ctx.stroke();
  inked = true; $("padHint").hidden = true; e.preventDefault();
});
pad.addEventListener("pointermove", e => {
  if (!drawing) return;
  const r = pad.getBoundingClientRect(); ctx.lineTo(e.clientX - r.left, e.clientY - r.top); ctx.stroke();
});
["pointerup", "pointercancel"].forEach(t => pad.addEventListener(t, () => { drawing = false; }));
$("clear").addEventListener("click", clearPad);
document.querySelectorAll("#seg button").forEach(b => b.addEventListener("click", () => {
  if (state === "self" || state === "ok") return;
  inputMode = b.dataset.im; store.set("im", inputMode);
  if (state === "revealed") { next(); return; }
  ui();
}));
window.addEventListener("resize", () => { if (inputMode === "write" && state === "ask" && !inked) sizePad(); });
function selfCheck() {
  state = "self"; drawing = false;
  msg.className = "msg"; msg.innerHTML = '答え： <span class="answer"></span>　自分の字と見比べて採点';
  msg.querySelector(".answer").textContent = cur[0];
  ui();
}
function selfResult(good) {
  if (good) { correct(); ui(); return; }
  if (mode === "chal") return finish();
  if (mode === "test" && !tried) missed.push(cur);
  streak = 0; renderStats(); next();
}
$("okb").addEventListener("click", () => selfResult(true));
$("ng").addEventListener("click", () => selfResult(false));
function correct() {
  state = "ok";
  if (!tried) { score++; streak++; if (streak > best) best = streak; }
  card.className = "card ok"; input.value = cur[0]; input.disabled = true;
  msg.className = "msg ok"; msg.textContent = "正解！";
  renderStats(); ui(); timer = setTimeout(next, 650);
}
function check() {
  if (state === "revealed") return next();
  if (state !== "ask") return;
  const v = norm(input.value);
  if (!v) return;
  if (v === cur[0]) return correct();
  if (mode === "chal") return finish(v);
  if (!tried) { tried = true; streak = 0; if (mode === "test") missed.push(cur); }
  streak = 0; renderStats();
  card.className = "card"; void card.offsetWidth; card.className = "card shake";
  msg.className = "msg bad"; msg.textContent = "ちがいます。もう一度！";
  input.select();
}
function reveal() {
  if (state === "revealed") return next();
  if (state !== "ask") return;
  if (inputMode === "write") return selfCheck();
  if (mode === "chal") return finish();
  if (mode === "test" && !tried) missed.push(cur);
  tried = true; streak = 0; state = "revealed"; renderStats();
  card.className = "card revealed"; input.disabled = true; input.value = "";
  msg.className = "msg"; msg.innerHTML = '答え： <span class="answer"></span>';
  msg.querySelector(".answer").textContent = cur[0];
  $("reveal").textContent = "次の問題へ"; $("go").hidden = true;
  $("reveal").focus();
}
function finish(typed) {
  clearTimeout(timer);
  const r = $("result"); let h = "", nb = false, res;
  if (mode === "chal") {
    if (streak > rec.chal) { rec.chal = streak; store.set("chal", streak); nb = streak > 0; }
    res = { kind: "chal", score: streak };
    h = '<h2>チャレンジ終了</h2><div class="big">' + streak + '<small> 問連続</small></div>' + (nb ? '<span class="newbest">最高記録！</span>' : '') +
      '<p>最高記録：' + rec.chal + ' 問連続<br>ミスした問題：<b>' + esc(cur[1]) + '</b> → <b style="color:var(--accent);font-family:var(--font-mono)">' + esc(cur[0]) + '</b>' + (typed ? '（入力：' + esc(typed) + '）' : '') + '</p>';
  } else {
    const ms = Date.now() - t0;
    res = { kind: "test", score, ms, order: testOrder };
    const b = rec.test;
    if (!b || score > b.score || (score === b.score && ms < b.ms)) { rec.test = { score, ms }; store.set("test", rec.test); nb = true; }
    h = '<h2>テスト結果</h2><div class="big">' + score + '<small> / 30</small></div>' + (nb ? '<span class="newbest">ベスト更新！</span>' : '') +
      '<p>かかった時間：' + fmt(ms) + '</p>';
    h += missed.length ? '<p>間違えた単語（' + missed.length + '）</p><ul class="miss">' + missed.map(m => '<li><span class="w">' + esc(m[0]) + '</span><span class="j">' + esc(m[1]) + '</span></li>').join("") + '</ul>'
      : '<p>全問正解！パーフェクトです。</p>';
  }
  if (res.score > 0) h += '<div class="submit"><label for="rname">ランキングに登録（名前は12文字まで）</label><div class="line"><input type="text" id="rname" maxlength="12" placeholder="なまえ" autocomplete="nickname" value="' + esc(store.get("name") || "") + '"><button type="button" class="primary" id="rsend">登録</button></div><div class="hint" id="rhint"></div></div>';
  h += '<div class="row"><button type="button" class="primary" id="again">もう一度</button><button type="button" id="toHome">ホームへ</button></div>';
  r.innerHTML = h; show("result");
  if ($("rsend")) $("rsend").onclick = () => sendScore(res);
  const m = mode;
  $("again").onclick = () => start(m);
  if (m === "test") { const c = document.createElement("button"); c.type = "button"; c.textContent = "順番を選び直す"; c.onclick = () => show("order"); $("again").parentNode.insertBefore(c, $("toHome")); }
  $("toHome").onclick = home;
}

const COL = { chal: "ranking_chal", test: "ranking_test" };
const NO_DB = "ランキングに接続できません。HTMLファイルをブラウザで直接開き、ネットに接続してください。";
let sent = false;
async function sendScore(res) {
  const hint = $("rhint"), name = $("rname").value.trim().slice(0, 12);
  if (!db) { hint.textContent = NO_DB; return; }
  if (!name) { hint.textContent = "名前を入力してください。"; return; }
  if ($("rsend").dataset.done) return;
  $("rsend").disabled = true; hint.textContent = "送信中…";
  store.set("name", name);
  const rank = res.kind === "chal" ? res.score * 1e13 - Date.now() : res.score * 1e7 - Math.min(res.ms, 9999999);
  const doc = { name, score: res.score, rank, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
  if (res.kind === "test") { doc.ms = res.ms; doc.order = res.order; }
  try {
    await db.collection(COL[res.kind]).add(doc);
    $("rsend").dataset.done = "1"; $("rsend").textContent = "登録済み"; hint.textContent = "登録しました。ホームのランキングで見られます。";
  } catch (e) { $("rsend").disabled = false; hint.textContent = "登録できませんでした。通信を確認してもう一度試してください。"; }
}
let rankKind = "chal";
async function loadRank() {
  const list = $("rankList"), m = $("rankMsg");
  document.querySelectorAll("#rankSeg button").forEach(b => b.classList.toggle("on", b.dataset.k === rankKind));
  list.innerHTML = "";
  if (!db) { m.textContent = NO_DB; return; }
  m.textContent = "読み込み中…";
  const kind = rankKind;
  try {
    const snap = await db.collection(COL[kind]).orderBy("rank", "desc").limit(20).get();
    if (kind !== rankKind) return;
    m.textContent = snap.empty ? "まだ記録がありません。最初の1位をめざそう！" : "";
    let i = 0;
    snap.forEach(d => {
      const x = d.data(); i++;
      const sc = kind === "chal" ? x.score + " 問連続" : x.score + " / 30<small>" + fmt(x.ms || 0) + (x.order === "seq" ? "・順番" : "・ランダム") + "</small>";
      list.insertAdjacentHTML("beforeend", '<li><span class="n">' + i + '</span><span class="nm">' + esc(x.name || "?") + '</span><span class="sc">' + sc + '</span></li>');
    });
  } catch (e) { m.textContent = "読み込めませんでした。通信状態を確認してください。"; }
}
